name: backend-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # CJK fonts are installed in the runtime Dockerfile. Unit tests validate SVG strings and PNG output.
      - run: python -c "import ctypes.util; assert ctypes.util.find_library('cairo')"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q tests
