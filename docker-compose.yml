services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comic_studio
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U comic -d comic_studio"]
      interval: 5s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://comic:${POSTGRES_PASSWORD:-local-development-only}@db:5432/comic_studio
      ASSET_DIR: /data/assets
      STORY_API_BASE_URL: ${STORY_API_BASE_URL:-}
      STORY_MODEL: ${STORY_MODEL:-}
      STORY_API_KEY: ${STORY_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_REFERENCE_MODE: ${IMAGE_REFERENCE_MODE:-off}
      IMAGE_SIZE: ${IMAGE_SIZE:-1536x1024}
    volumes:
      - asset_data:/data/assets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  worker:
    build: ./server
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://comic:${POSTGRES_PASSWORD:-local-development-only}@db:5432/comic_studio
      ASSET_DIR: /data/assets
      STORY_API_BASE_URL: ${STORY_API_BASE_URL:-}
      STORY_MODEL: ${STORY_MODEL:-}
      STORY_API_KEY: ${STORY_API_KEY:-}
      IMAGE_API_BASE_URL: ${IMAGE_API_BASE_URL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_REFERENCE_MODE: ${IMAGE_REFERENCE_MODE:-off}
      IMAGE_SIZE: ${IMAGE_SIZE:-1536x1024}
      WORKER_POLL_SECONDS: "2"
    volumes:
      - asset_data:/data/assets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: ./web
    depends_on: [api]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  db_data:
  asset_data:
