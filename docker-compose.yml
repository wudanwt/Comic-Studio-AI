services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comic_studio
      POSTGRES_USER: comic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U comic -d comic_studio"]
      interval: 5s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://comic:${POSTGRES_PASSWORD:-local-development-only}@db:5432/comic_studio
      ASSET_DIR: /data/assets
    volumes:
      - asset_data:/data/assets
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build: ./web
    depends_on: [api]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  db_data:
  asset_data:
